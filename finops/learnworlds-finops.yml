meters:
- name: plan_subscription
  description: Flat monthly (or annual) plan fee for the chosen tier.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: enrollment_fee
  description: Per-course-enrollment transaction fee (Starter plan only), $5 per enrollment.
  unit: enrollments
  aggregation: sum
  dimensions:
  - account
  - course
- name: gateway_fee
  description: Third-party payment-gateway processing fees (Stripe / PayPal), billed by the gateway, not LearnWorlds.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - gateway
principles:
- name: Visibility
  description: Track the fixed plan cost and, on Starter, per-enrollment fees; separate LearnWorlds charges from payment-gateway fees.
- name: Allocation
  description: Attribute the single platform subscription across the products / teams that use the school.
- name: Optimization
  description: Right-size the plan tier (only step up to Learning Center when API & webhooks or its advanced features are actually needed) and choose annual billing to save ~17-20%.
- name: Accountability
  description: Assign an owner for the LearnWorlds subscription and review plan tier against actual feature usage each renewal.
