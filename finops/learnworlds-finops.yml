description: >-
  FinOps view of LearnWorlds spend. LearnWorlds is a flat-rate SaaS course
  platform billed on monthly (or annually discounted) plan tiers - Starter, Pro
  Trainer, Learning Center, and High Volume & Corporate - not a metered API
  product. There is no per-API-call charge; API and webhook access is a feature
  gated to the Learning Center and High Volume & Corporate tiers, so the API
  cost is effectively the price step up to a plan that includes it. The Starter
  plan adds a $5 per-course-enrollment transaction fee. Payment-gateway
  processing fees (Stripe / PayPal) are billed separately by those providers.
notes: >-
  Because pricing is plan-based rather than usage-based, cost optimization is
  primarily about choosing the right plan tier and billing cadence (annual saves
  roughly 17-20%) rather than tuning API call volume. Verify current plan prices
  and gateway fees on the LearnWorlds pricing page during reconciliation.
