specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: LearnWorlds
providerId: learnworlds
created: '2026-07-05'
modified: '2026-07-05'
reconciled: false
tags:
- Online Courses
- LMS
- eLearning
- Education
- Plans
description: >-
  LearnWorlds is sold as a SaaS course platform on published monthly tiers, not
  as a metered API product. There is no separate charge for API calls; instead,
  API and webhook access is a feature gated to the higher plan tiers. The plans
  are Starter, Pro Trainer, Learning Center, and High Volume & Corporate. API &
  Webhooks are included on Learning Center and High Volume & Corporate only.
  Prices below are USD, exclude VAT, and reflect published pricing as of the
  review date; the annual price is the effective per-month cost when billed
  annually. All paid plans include a 30-day free trial.
notes: >-
  API access is NOT available on Starter or Pro Trainer. Verify current pricing
  and plan feature gates on the LearnWorlds pricing page during reconciliation.
  Payment-gateway fees (e.g. Stripe / PayPal ~2.9% + $0.30) are charged
  separately by those providers.
sources:
- https://www.learnworlds.com/pricing/
- https://support.learnworlds.com/support/solutions/articles/12000017230-learnworlds-api-documentation
plans:
- id: learnworlds-starter
  name: Starter
  type: paid
  description: >-
    Entry plan for individual creators. Does NOT include API or webhook access.
    Carries a per-course-enrollment transaction fee.
  entries:
  - label: Monthly (billed monthly)
    name: starter_monthly
    type: flat
    metric: subscription
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: '29.00'
    currency: USD
    userMultiplied: false
  - label: Monthly (billed annually)
    name: starter_annual
    type: flat
    metric: subscription
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: '24.00'
    currency: USD
    userMultiplied: false
  - label: Per-Enrollment Fee
    name: starter_enrollment_fee
    type: usage
    metric: enrollments
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: '5.00'
    currency: USD
    userMultiplied: false
  elements:
  - name: Build and Sell Courses
  - name: No API Access
  - name: No Webhook Access
