aid: learnworlds
url: https://raw.githubusercontent.com/api-evangelist/learnworlds/refs/heads/main/apis.yml
name: LearnWorlds
kind: company
description: LearnWorlds is an online course and learning management (LMS) platform
  that lets creators, trainers, and businesses build, sell, and run branded online
  schools. Its REST API (v2) is served per-school from
  https://{school}.learnworlds.com/admin/api/v2 and exposes school entities - users,
  courses, enrollments, subscriptions, payments, course progress, tags, bundles, and
  certificates - plus webhooks for real-time events. Requests are authenticated with
  OAuth2 client credentials (a bearer access token) together with an Lw-Client header
  identifying the client application. API and webhook access is a plan-gated feature
  available on the Learning Center and High Volume & Corporate plans.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: true
  try_now: true
  public: false
